[package]
name = "perfect_match"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.11.0"
itertools = "0.14.0"
indicatif = { version = "0.18.3", features = ["rayon"] }

[profile.release]
opt-level = 3
lto = true          # Enables "Fat" LTO for cross-crate optimization
codegen-units = 1   # Forces the compiler to optimize the whole crate as a single unit
